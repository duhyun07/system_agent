llm:
  openai_model: ""  # Set a currently available Responses API model.
  input_usd_per_million: 0  # Set current model pricing before use.
  output_usd_per_million: 0
network:
  search_provider: duckduckgo
  allowed_domains:  # Add exact domains; use *.example.org for subdomains.
    - html.duckduckgo.com
    - "*.duckduckgo.com"
    - duckduckgo.com
limits:
  max_tool_calls_per_task: 30
  max_spend_usd: 0  # Set a positive task budget before use.
  max_read_bytes: 1048576
  max_fetch_bytes: 2097152
  max_fetch_redirects: 3
  max_execution_seconds: 120
